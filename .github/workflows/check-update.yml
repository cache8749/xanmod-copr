name: Sync Fedora and build XanMod

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs push to fedora/ or submit to copr at the same time.
concurrency:
  group: xanmod-copr
  cancel-in-progress: false

jobs:
  build:
    name: XanMod to copr
    runs-on: ubuntu-latest
    env:
      COPR_PROJECT: brigge/XanMod
    steps:
      # The big git clone and tarball go on the roomier runner volume.
      # runner.* isn't available in job-level env, so export it here instead.
      - name: Point TMPDIR at the runner scratch volume
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve XanMod release
        id: xanmod
        run: tools/xanmod-release.sh

      - name: Sync Fedora dist-git into fedora/
        id: fedora
        run: tools/sync-fedora.sh "${{ steps.xanmod.outputs.series }}"

      - name: Decide whether to build
        id: decide
        if: steps.fedora.outputs.matched == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.xanmod.outputs.tag }}"
          branch=$(jq -r .branch fedora-sync.json)
          pkgrelease=$(jq -r .pkgrelease fedora-sync.json)

          build=true
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            reason="build forced by workflow_dispatch"
          elif [ ! -f build-state.json ]; then
            reason="no previous build recorded"
          else
            prev_tag=$(jq -r '.xanmod_tag // ""' build-state.json)
            prev_branch=$(jq -r '.fedora_branch // ""' build-state.json)
            prev_pkgrelease=$(jq -r '.fedora_pkgrelease // ""' build-state.json)
            if [ "$tag" != "$prev_tag" ]; then
              reason="new XanMod release: $prev_tag -> $tag"
            elif [ "$branch" != "$prev_branch" ]; then
              reason="Fedora branch moved: $prev_branch -> $branch"
            elif [ "$pkgrelease" != "$prev_pkgrelease" ]; then
              reason="Fedora rebased: release $prev_pkgrelease -> $pkgrelease"
            else
              build=false
              reason="already built $tag on Fedora $branch release $pkgrelease"
            fi
          fi

          echo "$reason"
          {
            echo "build=$build"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always() && steps.fedora.conclusion == 'success'
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| XanMod tag | \`${{ steps.xanmod.outputs.tag }}\` |"
            if [ "${{ steps.fedora.outputs.matched }}" = "true" ]; then
              echo "| Fedora branch | \`${{ steps.fedora.outputs.branch }}\` (kernel $(jq -r .nvr fedora-sync.json)) |"
              echo "| Decision | ${{ steps.decide.outputs.reason }} |"
            else
              echo "| Fedora branch | **no released branch ships kernel ${{ steps.xanmod.outputs.series }} yet - build skipped** |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        if: steps.decide.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Assemble build tree
        if: steps.decide.outputs.build == 'true'
        run: tools/assemble.sh "${{ steps.xanmod.outputs.version }}" "${{ steps.xanmod.outputs.tag }}"

      - name: Build SRPM
        id: srpm
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/rpmbuild/{BUILD,RPMS,SRPMS,SOURCES,SPECS,tmp}
          rpmbuild -bs \
            --define "debug_package %{nil}" \
            --define "_sourcedir $PWD/build" \
            --define "_srcrpmdir $PWD/build" \
            --define "_topdir $PWD/build/rpmbuild" \
            --define "_tmppath $PWD/build/rpmbuild/tmp" \
            build/kernel.spec
          srpm=$(ls build/*.src.rpm)
          ls -lh "$srpm"
          echo "path=$srpm" >> "$GITHUB_OUTPUT"

      - name: Install copr-cli
        if: steps.decide.outputs.build == 'true'
        run: pipx install copr-cli || pip3 install --break-system-packages copr-cli

      - name: Configure copr-cli
        if: steps.decide.outputs.build == 'true'
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Submit build to copr
        if: steps.decide.outputs.build == 'true'
        run: |
          echo "Submitting ${{ steps.srpm.outputs.path }} to $COPR_PROJECT"
          copr-cli build "$COPR_PROJECT" "${{ steps.srpm.outputs.path }}" --nowait

      - name: Record what was submitted
        if: steps.decide.outputs.build == 'true'
        run: |
          tools/record-build.sh \
            "${{ steps.xanmod.outputs.tag }}" \
            "${{ steps.xanmod.outputs.version }}" \
            "${{ steps.srpm.outputs.path }}"

      - name: Commit fedora/ sync and build state
        if: steps.fedora.outputs.matched == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fedora fedora-sync.json
          # Only exists once a build has actually been submitted.
          if [ -f build-state.json ]; then git add build-state.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          nvr=$(jq -r .nvr fedora-sync.json)
          if [ "${{ steps.decide.outputs.build }}" = "true" ]; then
            msg="Build ${{ steps.xanmod.outputs.tag }} on Fedora ${{ steps.fedora.outputs.branch }} ($nvr)"
          else
            msg="Sync Fedora ${{ steps.fedora.outputs.branch }} ($nvr)"
          fi
          git commit -m "$msg"
          git pull --rebase --autostash
          git push
